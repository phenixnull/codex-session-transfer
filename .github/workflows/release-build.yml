name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            npm_script: release:win
          - os: macos-latest
            platform: mac
            npm_script: release:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build packaged app
        run: npm run ${{ matrix.npm_script }}

      - uses: actions/upload-artifact@v4
        with:
          name: codex-session-transfer-${{ matrix.platform }}
          path: release/v*/**
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: github-release

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "Codex Session Transfer $TAG_NAME" --notes "Windows and macOS desktop packages."

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find github-release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name 'SHA256SUMS-*.txt' -o -name 'manifest-*.json' \) -print0)

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            echo "Uploading release asset: $name"
            gh release upload "$TAG_NAME" "$file" --clobber
          done
